<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="spaceGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <!-- Background circle with safe zone margin -->
  <rect width="512" height="512" rx="128" fill="url(#spaceGrad)"/>
  
  <!-- Cosmic Orbit Rings with Math Angle Marks -->
  <ellipse cx="256" cy="256" rx="200" ry="70" fill="none" stroke="url(#orbitGrad)" stroke-width="6" opacity="0.4" transform="rotate(-30 256 256)"/>
  <ellipse cx="256" cy="256" rx="160" ry="50" fill="none" stroke="url(#orbitGrad)" stroke-width="4" opacity="0.6" stroke-dasharray="12 8" transform="rotate(25 256 256)"/>

  <!-- Math Symbol Constellations -->
  <text x="90" y="140" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="36" opacity="0.75">√x</text>
  <text x="360" y="130" fill="#c084fc" font-family="sans-serif" font-weight="bold" font-size="32" opacity="0.75">∑</text>
  <text x="100" y="400" fill="#facc15" font-family="sans-serif" font-weight="bold" font-size="34" opacity="0.75">sinα</text>
  <text x="370" y="390" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="36" opacity="0.75">π</text>

  <!-- Central Cosmic Rocket / Compass Geometry -->
  <g transform="translate(180, 110) scale(0.62)">
    <!-- Exhaust flame -->
    <path d="M 120 330 C 100 400, 120 460, 120 490 C 120 460, 140 400, 120 330 Z" fill="#f97316" />
    <path d="M 120 330 C 110 380, 120 430, 120 450 C 120 430, 130 380, 120 330 Z" fill="#facc15" />

    <!-- Rocket Body -->
    <path d="M 120 30 C 70 110, 50 240, 60 330 L 180 330 C 190 240, 170 110, 120 30 Z" fill="url(#rocketGrad)" />
    
    <!-- Wings -->
    <path d="M 60 260 L 10 340 L 60 320 Z" fill="#3b82f6"/>
    <path d="M 180 260 L 230 340 L 180 320 Z" fill="#3b82f6"/>
    
    <!-- Porthole with math "9" -->
    <circle cx="120" cy="180" r="42" fill="#0369a1" stroke="#e0f2fe" stroke-width="8"/>
    <text x="120" y="202" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="52" text-anchor="middle">9</text>
    
    <!-- Nosecone tip -->
    <path d="M 120 30 C 100 80, 85 110, 85 110 L 155 110 C 155 110, 140 80, 120 30 Z" fill="#ef4444"/>
  </g>

  <!-- Stars -->
  <circle cx="120" cy="220" r="4" fill="#ffffff" opacity="0.8"/>
  <circle cx="390" cy="230" r="5" fill="#38bdf8" opacity="0.9"/>
  <circle cx="210" cy="80" r="3" fill="#ffffff" opacity="0.7"/>
  <circle cx="310" cy="450" r="4" fill="#fef08a" opacity="0.8"/>
</svg>
